services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      # Leave unset to let Jupyter generate a token and print it at startup.
      JUPYTER_TOKEN: ${NOTEBOOK_TOKEN:-}
    command: ["start-notebook.py", "--ServerApp.root_dir=/home/impresso"]
    volumes:
      - .:/home/impresso:rw
